<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Piano</title>
<style>
body{font-family:Arial;background:#f1f5f9;text-align:center;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
#keys{display:flex;justify-content:center;margin:30px 0}
.key{height:170px;width:65px;background:white;border:2px solid #334155;border-radius:0 0 8px 8px;font-weight:bold;cursor:pointer}
.key:active{background:#bfdbfe}
</style>
</head>
<body>
<main>
<h1>Digital Piano</h1>
<p>Click a key or use keyboard keys A, S, D, F, G, H, J.</p>
<div id="keys">
<button class="key" data-note="261.63">A</button>
<button class="key" data-note="293.66">S</button>
<button class="key" data-note="329.63">D</button>
<button class="key" data-note="349.23">F</button>
<button class="key" data-note="392.00">G</button>
<button class="key" data-note="440.00">H</button>
<button class="key" data-note="493.88">J</button>
</div>
<p id="status">Ready to play.</p>
</main>
<script>
let audio;
function play(freq){
 audio=audio||new (window.AudioContext||window.webkitAudioContext)();
 if(audio.state==="suspended")audio.resume();
 const oscillator=audio.createOscillator();
 const gain=audio.createGain();
 oscillator.type="sine";
 oscillator.frequency.value=freq;
 oscillator.connect(gain);
 gain.connect(audio.destination);
 gain.gain.setValueAtTime(0.3,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+0.5);
 oscillator.start();
 oscillator.stop(audio.currentTime+0.5);
 document.getElementById("status").textContent="Playing "+freq+" Hz";
}
document.querySelectorAll(".key").forEach(key=>{
 key.addEventListener("click",()=>play(Number(key.dataset.note)));
});
const map={a:261.63,s:293.66,d:329.63,f:349.23,g:392,h:440,j:493.88};
document.addEventListener("keydown",e=>{
 if(e.repeat||e.target.matches("input,textarea"))return;
 const note=map[e.key.toLowerCase()];
 if(note)play(note);
});
</script>
</body>
</html>
